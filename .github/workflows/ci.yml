name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]
    
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 📥 Install dependencies
      run: npm ci
    
    - name: 🔍 Run linter (if configured)
      run: npm run lint || echo "No lint script found, skipping..."
      continue-on-error: true
    
    - name: 🧪 Run tests (if configured)
      run: npm test || echo "No test script found, skipping..."
      continue-on-error: true
      env:
        MONGODB_URI: mongodb://localhost:27017/meanstacktutorials_test
    
    - name: 🏗️ Build check
      run: |
        echo "Checking if application starts..."
        timeout 10s node server.js &
        sleep 5
        echo "Application check completed"
      env:
        MONGODB_URI: mongodb://localhost:27017/meanstacktutorials_test
        PORT: 8080

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
    
    - name: 📥 Install dependencies
      run: npm ci
    
    - name: 🔍 Check for vulnerabilities
      run: npm audit --audit-level=moderate || echo "Vulnerabilities found, review required"
      continue-on-error: true
    
    - name: 📊 Check package versions
      run: npm outdated || true
