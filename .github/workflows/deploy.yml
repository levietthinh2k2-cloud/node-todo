name: Deploy Application

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: http://${{ secrets.SERVER_HOST }}:8081
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: 📁 Copy docker-compose to server
      run: |
        scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:~/node-todo/
    
    - name: 🚀 Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ~/node-todo
          
          # Pull latest images
          docker compose pull
          
          # Stop old containers
          docker compose down
          
          # Start new containers
          docker compose up -d
          
          # Wait for application to start
          sleep 15
          
          # Health check
          curl -f http://localhost:8081 || exit 1
          
          echo "✅ Deployment completed successfully!"
    
    - name: 💊 Health Check
      run: |
        sleep 10
        curl -f http://${{ secrets.SERVER_HOST }}:8081 || exit 1
        echo "✅ Application is healthy!"
    
    - name: 🧹 Cleanup old images
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          docker image prune -f
          echo "🧹 Cleaned up unused images"

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: 📢 Send notification
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi